name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and run tests with JaCoCo
      run: |
        cd java-assignment
        ./mvnw clean verify -Dquarkus.jacoco.report=true

    - name: Check Coverage
      run: |
        cd java-assignment
        # Parse jacoco.csv to get coverage and fail if less than 80%
        awk -F, '{ instructions += $4 + $5; covered += $5 } END { print covered, "/", instructions, " instructions covered"; if (covered/instructions < 0.80) { print "Coverage is below 80%!"; exit 1 } }' target/jacoco-report/jacoco.csv
